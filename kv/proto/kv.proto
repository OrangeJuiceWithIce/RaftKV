
syntax = "proto3";

package kvraft;

option go_package = "github.com/OrangeJuiceWithIce/raftkv/kv/pb;kvpb";

service KVService {
    rpc Command(CommandRequest)
        returns (CommandResponse);
}

message CommandRequest {
    string op = 1;

    string key = 2;
    string value = 3;

    int64 client_id = 4;
    int64 command_id = 5;
}

message CommandResponse {
    string err = 1;
    string value = 2;
}
