syntax = "proto3";

package raft;

option go_package = "github.com/OrangeJuiceWithIce/raftkv/pb;pb";

service RaftService {
  rpc RequestVote(RequestVoteRequest)
      returns (RequestVoteResponse);

  rpc AppendEntries(AppendEntriesRequest)
      returns (AppendEntriesResponse);

  rpc InstallSnapshot(InstallSnapshotRequest)
      returns (InstallSnapshotResponse);
}

// ===== Lab 2A：选举 =====

message RequestVoteRequest {
  int64 term = 1;
  int64 candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

// ===== Lab 2B：日志复制 =====

message LogEntry {
  int64 term = 1;
  bytes command = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int64 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;

  // 用于优化日志冲突回退
  int64 conflict_index = 3;
  int64 conflict_term = 4;
}

// ===== Lab 2D：快照 =====

message InstallSnapshotRequest {
  int64 term = 1;
  int64 leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  int64 term = 1;
}